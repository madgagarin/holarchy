[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "holarchy"
version = "1.0.0"
description = "A state-machine based orchestrator for long-running AI and other jobs."
readme = "README.md"
requires-python = ">=3.11"
license = "MPL-2.0"
authors = [
    { name = "Dmitry Gagarin aka madgagarin", email = "madgagarin@gmail.com" },
]
keywords = ["orchestrator", "state-machine", "workflow", "distributed", "ai", "llm", "rxon", "hln"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "rxon>=1.0.0,<2.0.0",
    "fast-magic-filter~=1.1.0",
    "aiohttp~=3.14.3",
    "python-json-logger~=4.2.0",
    "graphviz~=0.21.0",
    "zstandard~=0.25.0",
    "orjson~=3.12.0",
    "cryptography>=50.0.1,<51.0.0",
    "cachebox>=6.2.7,<7.0.0",
]

[project.scripts]
holarchy = "holarchy.cli.__main__:main"

[project.optional-dependencies]
redis = ["redis>=8.1.0,<9.0.0"]
s3 = ["obstore>=0.11.1,<1.0.0", "aiofiles>=25.1.0,<26.0.0"]
history = ["aiosqlite>=0.22.1,<1.0.0", "asyncpg>=0.31.0,<1.0.0"]
telemetry = [
    "opentelemetry-api>=1.44.0,<2.0.0",
    "opentelemetry-sdk>=1.44.0,<2.0.0",
    "opentelemetry-exporter-otlp>=1.44.0,<2.0.0",
    "opentelemetry-instrumentation-aiohttp-client>=0.65b0",
]
all = [
    "holarchy[redis]",
    "holarchy[s3]",
    "holarchy[history]",
    "holarchy[telemetry]",
]
test = [
    "holarchy[all]",
    "pytest~=9.1.1",
    "pytest-asyncio~=1.4.0",
    "fakeredis~=2.38.0",
    "pytest-aiohttp~=1.1.1",
    "pytest-mock~=3.15.1",
    "aioresponses~=0.7.9",
    "docker~=7.2.0",
    "mutmut>=3.8.0",
]

[project.urls]
"Homepage" = "https://github.com/madgagarin/holarchy"
"Bug Tracker" = "https://github.com/madgagarin/holarchy/issues"

[tool.setuptools.package-data]
"holarchy" = ["api.html", "py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.exclude-package-data]
"*" = ["tests*", "advanced_architecture_proposals.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["new", ".venv", "build", "dist", "*.egg-info", "mutants", ".mutmut-cache"]
pythonpath = "src"
markers = [
    "e2e: marks tests as end-to-end tests",
]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    "ignore:coroutine 'AsyncMockMixin._execute_mock_call' was never awaited:RuntimeWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]

[tool.ruff]
src = ["src", "tests"]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "A", "SIM", "C4", "PLC", "UP", "TID"]
ignore = ["TID252"]

[tool.ruff.lint.flake8-builtins]
builtins-ignorelist = ["input", "id"]

[tool.ruff.lint.pyupgrade]
keep-runtime-typing = false

[tool.ruff.lint.isort]
known-first-party = ["holarchy"]

[tool.ruff.format]
quote-style = "double"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.11"
packages = ["holarchy"]
disallow_incomplete_defs = true
disallow_untyped_calls = true
no_implicit_optional = true
ignore_missing_imports = true
follow_imports = "skip"
warn_unused_ignores = true
warn_return_any = true
disallow_any_unimported = false
exclude = ["tests/"]

[tool.mutmut]
source_paths = ["src/holarchy"]
pytest_add_cli_args_test_selection = ["tests/"]
pytest_add_cli_args = ["-q", "--no-header", "--tb=no", "--ignore=mutants"]
mutate_only_covered_lines = true
use_git_change_detection = true
